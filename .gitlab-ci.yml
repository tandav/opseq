stages:
  - test
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  RUFF_CACHE_DIR: "$CI_PROJECT_DIR/.cache/ruff_cache"
  MYPY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/mypy_cache"
  PYTHON_IMAGE: python:3.14

cache:
  key: $CI_PROJECT_NAME
  paths:
    - .cache/

test:
  stage: test
  needs: []
  tags:
    - u60
    - docker
  image: $PYTHON_IMAGE
  script:
    - pip install .[all,dev]
    - pytest
    # - pytest --cov collection_sync --cov-report term --cov-report xml --junitxml report.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  # artifacts:
  #   when: always
  #   expire_in: 1 week
  #   reports:
  #     coverage_report:
  #       coverage_format: cobertura
  #       path: coverage.xml
  #     junit: report.xml

lint:
  stage: test
  needs: []
  image: $PYTHON_IMAGE
  variables:
    PIP_INDEX_URL: https://pypi.tandav.me/index/
  script:
    - pip install pre-commit
    - pre-commit run --all-files

release-pypi:
  stage: release
  image: $PYTHON_IMAGE
  variables:
    TWINE_USERNAME: __token__
    TWINE_PASSWORD: $PYPI_PASSWORD
  script:
    - python -m pip install --upgrade setuptools build twine
    - python -m build .
    - python -m twine upload dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
